{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Play</title>
    <link rel="stylesheet" href="{% static 'pages/css/output.css' %}">
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
</head>

<body class="bg-gray-100 items-center justify-center min-h-screen">
    <header>
        <nav class="flex items-center gap-6">
            <a href="#" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Home</a>
            <a href="#" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Recipes</a>
            <a href="#" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Admin Login</a>
        </nav>
    </header>
    <div id="prodcut-container" class="grid grid-cols-3 gap-4 p-4">
        <section id="product-section" class="col-span-2">
            <h2>Products</h2>
            <div id="products"></div>
        </section>
        <section id="cart-section">
            <h2>Shopping Cart</h2>
            <div id="cart-products"></div>
            <div class="grid grid-cols-2 gap-4 p-4">
                <div id="cart-total" class="">Total</div>
                <div id="total-amount" class="text-right">0.00</div>
            </div>
        </section>
    </div>

    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto text-center">
            &copy; 2026. All rights reserved.
        </div>
        <script type="text/javascript" src="{% static 'pages/js/recipes.js' %}"></script>
        <script type="text/javascript" src="{% static 'pages/js/script.js' %}"></script>
    </footer>
</body>
</html>
