{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="{% static 'pages/css/output.css' %}">
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
</head>

<body class="bg-white-100 items-center justify-center min-h-screen">
    <header>
        <nav class="flex items-center gap-6 p-4 bg-gray-100 border-b border-gray-200">
            <a href="/" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Home</a>
            <a href="/recipes/" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Recipes</a>
            <a href="/admin/login/" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">Admin Login</a>
        </nav>
    </header>

    <div id="prodcut-container" class="grid grid-cols-3 gap-4 p-4">
        <section id="product-section" class="col-span-2 w-full max-w-4xl mx-auto">
            <h2 class="text-xl font-bold text-gray-800 p-4">Recipes</h2>
            <div class="rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                <!-- TABLE HEADER (Hidden on mobile, grid layout from 'md' screens up) -->
                <div
                    class="hidden md:grid md:grid-cols-4 bg-gray-100 border-b border-gray-200 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    <div class="col-span-2 p-4">Product</div>
                    <div class="p-4">Price</div>
                    <div class="p-4">Actions</div>
                </div>
                <div id="products" class="divide-y divide-gray-200 bg-white">
                    <div id="spinner" class="h-10 w-10 mx-auto my-4 animate-spin rounded-full border-4 border-gray-200 border-t-blue-600"></div>
                </div>
            </div>

        </section>
        <section id="cart-section" class="w-full max-w-4xl mx-auto">
            <h2 class="text-xl font-bold text-gray-800 p-4">Cart</h2>
            <div class="rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                <div
                    class="hidden md:grid md:grid-cols-4 bg-gray-100 border-b border-gray-200 text-xs font-semibold uppercase tracking-wider text-gray-700">
                    <div class="p-4">Product</div>
                    <div class="p-4">Quantity</div>
                    <div class="p-4">Price</div>
                    <div class="p-4">Actions</div>
                </div>
                <div id="cart-products" class="divide-y divide-gray-200 bg-white"></div>
                <div class="grid grid-cols-4 gap-4 p-4">
                    <div id="cart-total" class="">Total</div>
                    <div id="total-quantity">0</div>
                    <div id="total-amount" class="col-span-2">0.00</div>
                </div>
            </div>
        </section>
    </div>

    <footer class="fixed inset-x-0 bottom-0 bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto text-center">
            &copy; 2026. All rights reserved.
        </div>
        <script type="text/javascript" src="{% static 'pages/js/recipes.js' %}"></script>
    </footer>
</body>

</html>
